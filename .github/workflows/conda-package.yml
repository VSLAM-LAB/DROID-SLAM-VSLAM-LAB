# Builds the droidslam conda package (CUDA 12.6 and 12.9 variants, see pixi.toml [package] and variants.yaml) on every
# push to main, and publishes it to https://prefix.dev/vslamlab/vslamlab when a version tag (vX.Y) is pushed.
# Publishing uses prefix.dev trusted publishing (OIDC): prefix.dev > Settings > Repository Access > GitHub,
# repository VSLAM-LAB/droidslam, workflow conda-package.yml, read/write on vslamlab/vslamlab. No API key is stored.
#
# Release: bump `version` in pixi.toml and pyproject.toml, push to main, check it on a GPU (VSLAM-LAB droidslam-dev),
# then `git tag vX.Y && git push origin vX.Y`.
name: conda-package

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Two CUDA/PyTorch build environments do not fit in the runner's default free space
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          pixi-version: v0.81.0
          run-install: false

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'EOF'
          import os, sys, tomllib
          tag = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          pixi = tomllib.load(open('pixi.toml', 'rb'))['package']['version']
          pyproject = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          if not tag == pixi == pyproject:
              sys.exit(f'tag v{tag} does not match pixi.toml [package] version {pixi} / pyproject.toml version {pyproject}')
          print(f'version {tag} OK')
          EOF

      # --clean: pixi reuses its build directory otherwise, and stale files end up in the package
      - name: Build both CUDA variants into a local channel
        run: pixi publish --clean --to "file://$PWD/channel"

      - name: Inspect packages
        run: |
          shopt -s nullglob
          pkgs=(channel/linux-64/droidslam-*.conda)
          [ ${#pkgs[@]} -eq 2 ] || { echo "expected 2 packages, found ${#pkgs[@]}"; exit 1; }
          for pkg in "${pkgs[@]}"; do
            echo "== $pkg"
            tmp=$(mktemp -d)
            unzip -q "$pkg" -d "$tmp"
            files=$(tar --zstd -tf "$tmp"/pkg-*.tar.zst)
            for f in bin/vslamlab_droidslam_mono bin/vslamlab_droidslam_rgbd bin/vslamlab_droidslam_stereo \
                     lib/python3.11/site-packages/droid_backends.so; do
              grep -qx "$f" <<< "$files" || { echo "missing $f"; exit 1; }
            done
            n=$(grep -c 'dist-info/METADATA$' <<< "$files")
            [ "$n" -eq 1 ] || { echo "expected 1 dist-info, found $n"; exit 1; }
          done

      # No GPU on the runner: CONDA_OVERRIDE_CUDA lets the solver accept the CUDA packages; only imports and --help run
      - name: Test each variant
        run: |
          for cuda in 12.6 12.9; do
            echo "== CUDA $cuda"
            CONDA_OVERRIDE_CUDA=$cuda pixi exec \
              -c "file://$PWD/channel" -c https://prefix.dev/vslamlab/vslamlab -c https://prefix.dev/conda-forge \
              -s droidslam -s "cuda-version=$cuda.*" -s python=3.11 -- \
              bash -c "python -I -c 'import droid_backends, lietorch; from droid_slam.droid import Droid; print(Droid)' \
                       && vslamlab_droidslam_mono --help > /dev/null \
                       && vslamlab_droidslam_rgbd --help > /dev/null \
                       && vslamlab_droidslam_stereo --help > /dev/null && echo OK"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: droidslam-packages
          path: channel/linux-64/droidslam-*.conda

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # trusted publishing to prefix.dev
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: droidslam-packages
          path: packages

      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          pixi-version: v0.81.0
          run-install: false

      # --skip-existing: a re-run after a partial upload never overwrites a published file
      - name: Upload to prefix.dev
        run: pixi exec rattler-build upload prefix --skip-existing --channel vslamlab/vslamlab packages/*.conda
